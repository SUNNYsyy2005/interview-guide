app:
  voice-interview:
    opening:
      skill-questions:
        ml-deep-learning: >
          你好，我是本场面试官。第一个问题：请用 1 分钟介绍一个你深度参与的机器学习或深度学习项目，
          按"问题定义、方法选择、实验设计、核心结果"回答，说完我会立刻追问模型细节。
        llm-ai-app: >
          你好，我是本场面试官。第一个问题：请介绍一个你参与的大模型或 AI 应用项目，
          按"应用场景、技术方案、你的贡献、效果评估"回答，说完我会追问架构决策。
        cv-multimodal: >
          你好，我是本场面试官。第一个问题：请介绍一个你参与的计算机视觉或多模态项目，
          按"任务定义、模型选择、实验设计、核心指标"回答，说完我会追问技术细节。
        systems-engineering: >
          你好，我是本场面试官。第一个问题：请用 1 分钟介绍一个你参与的系统工程项目，
          按"系统目标、架构设计、你负责的模块、性能指标"回答，说完我会追问设计权衡。
        robotics-embodied: >
          你好，我是本场面试官。第一个问题：请用 1 分钟介绍一个你参与的机器人或具身智能项目，
          按"任务场景、技术方案、你的贡献、实验结果"回答，说完我会追问算法和工程细节。
        ai-application: >
          你好，我是本场面试官。第一个问题：请介绍一个你参与的 AI 应用或创业项目，
          按"目标用户、核心价值、技术方案、落地效果"回答，说完我会追问产品和商业思考。
      algorithm-skills:
        - ml-deep-learning
        - systems-engineering
        - robotics-embodied
      algorithm-question: >
        你好，我是本场面试官。先做一道算法与数据结构热身题：请你从"哈希表/堆/栈/队列/树/图"里选两个，
        结合一道你熟悉的题，口述"为什么选这个结构、核心步骤、时间复杂度、空间复杂度、边界条件与反例"。
        本场不需要写代码，重点看你的思路和取舍。
      backend-question: >
        你好，我是本场面试官。第一个问题：请用 1 分钟介绍一个你深度参与的科研或项目，
        按三点回答：研究目标、你负责的核心模块、核心技术栈。说完我会立刻追问一个关键技术决策。
